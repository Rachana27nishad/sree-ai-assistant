<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sree AI - Bilingual Voice Assistant (English & Hindi) with Indian Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #06b6d4;
      --primary-glow: rgba(6, 182, 212, 0.6);
      --accent: #d946ef;
      --accent-glow: rgba(217, 70, 239, 0.6);
      --green: #10b981;
      --bg: #030712;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #180d38 0%, #0a0c20 50%, var(--bg) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      color: var(--text);
      overflow: hidden;
      padding: 24px 20px;
      position: relative;
    }

    /* Ambient Dynamic Glowing Background Lights */
    .ambient-glow-1 {
      position: absolute;
      width: 580px;
      height: 580px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 70, 239, 0.22) 0%, transparent 70%);
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      animation: floatAura 9s ease-in-out infinite alternate;
    }

    .ambient-glow-2 {
      position: absolute;
      width: 640px;
      height: 640px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.18) 0%, transparent 70%);
      bottom: -150px;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(110px);
      z-index: 0;
      pointer-events: none;
      animation: floatAura 12s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatAura {
      0% { transform: translateX(-50%) translateY(0) scale(1); }
      100% { transform: translateX(-50%) translateY(30px) scale(1.15); }
    }

    /* Top HUD / Header Bar */
    .top-hud {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 560px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: livePulse 1.8s infinite ease-in-out;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .hud-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #f472b6, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud-mode {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #38bdf8;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Main Stage: Holographic Interactive Voice Core */
    .stage-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 650px;
      margin: auto 0;
      cursor: pointer;
    }

    .orb-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    /* Concentric Luminous Energy Rings */
    .energy-ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      transition: all 0.5s ease;
    }

    .ring-1 {
      inset: -14px;
      border: 2px dashed rgba(217, 70, 239, 0.4);
      animation: spinClockwise 22s linear infinite;
    }

    .ring-2 {
      inset: -28px;
      border: 1.5px solid rgba(6, 182, 212, 0.3);
      animation: spinCounter 30s linear infinite;
    }

    .ring-3 {
      inset: -44px;
      border: 1px dotted rgba(255, 255, 255, 0.15);
      animation: pulseRipple 3.5s infinite ease-in-out;
    }

    @keyframes spinClockwise { 100% { transform: rotate(360deg); } }
    @keyframes spinCounter { 100% { transform: rotate(-360deg); } }
    @keyframes pulseRipple {
      0%, 100% { transform: scale(0.96); opacity: 0.3; }
      50% { transform: scale(1.05); opacity: 0.75; }
    }

    /* The Main Glowing 3D AI Spherical Core */
    .ai-orb {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f472b6 0%, #9333ea 50%, #06b6d4 100%);
      box-shadow: 0 0 75px var(--accent-glow), inset 0 0 45px rgba(255, 255, 255, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 64px;
      position: relative;
      z-index: 5;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      animation: floatOrb 4.5s infinite ease-in-out;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.03); }
    }

    /* STATE: LISTENING (Green-Cyan Waves, Mic Icon) */
    .stage-container.listening .ai-orb {
      background: radial-gradient(circle at 35% 30%, #34d399 0%, #059669 55%, #0e7490 100%);
      box-shadow: 0 0 95px rgba(16, 185, 129, 0.8), inset 0 0 50px rgba(255, 255, 255, 0.75);
      transform: scale(1.16);
      animation: listeningPulse 1.2s infinite ease-in-out;
    }

    .stage-container.listening .ring-1 {
      border-color: rgba(16, 185, 129, 0.7);
      animation-duration: 8s;
    }

    @keyframes listeningPulse {
      0%, 100% { transform: scale(1.12); box-shadow: 0 0 80px rgba(16, 185, 129, 0.7); }
      50% { transform: scale(1.22); box-shadow: 0 0 115px rgba(16, 185, 129, 0.95); }
    }

    /* STATE: THINKING (Swirling Violet Vortex) */
    .stage-container.thinking .ai-orb {
      background: radial-gradient(circle at 35% 30%, #fbbf24 0%, #8b5cf6 60%, #4c1d95 100%);
      box-shadow: 0 0 95px rgba(139, 92, 246, 0.85), inset 0 0 50px rgba(255, 255, 255, 0.7);
      animation: thinkingVortex 1s infinite linear;
    }

    @keyframes thinkingVortex {
      0% { transform: rotate(0deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1.08); }
    }

    /* STATE: SPEAKING (Dynamic Pink-Cyan Wave Flares) */
    .stage-container.speaking .ai-orb {
      background: radial-gradient(circle at 35% 30%, #f43f5e 0%, #d946ef 50%, #38bdf8 100%);
      box-shadow: 0 0 100px var(--accent-glow), inset 0 0 50px rgba(255, 255, 255, 0.75);
      animation: speakingPulse 0.7s infinite ease-in-out alternate;
    }

    @keyframes speakingPulse {
      0% { transform: scale(1.06); }
      100% { transform: scale(1.22); }
    }

    /* Live 11-Bar Sound Waveform Visualizer */
    .waveform-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 44px;
      margin-top: 8px;
    }

    .wave-bar {
      width: 4px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      transition: height 0.15s ease, background 0.3s ease;
    }

    .stage-container.listening .wave-bar {
      background: #10b981;
      animation: audioDance 0.8s infinite ease-in-out alternate;
    }

    .stage-container.speaking .wave-bar {
      background: #d946ef;
      animation: audioDance 0.5s infinite ease-in-out alternate;
    }

    .wave-bar:nth-child(1) { animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { animation-delay: 0.25s; }
    .wave-bar:nth-child(3) { animation-delay: 0.12s; }
    .wave-bar:nth-child(4) { animation-delay: 0.38s; }
    .wave-bar:nth-child(5) { animation-delay: 0.18s; }
    .wave-bar:nth-child(6) { animation-delay: 0.45s; }
    .wave-bar:nth-child(7) { animation-delay: 0.2s; }
    .wave-bar:nth-child(8) { animation-delay: 0.35s; }
    .wave-bar:nth-child(9) { animation-delay: 0.14s; }
    .wave-bar:nth-child(10) { animation-delay: 0.28s; }
    .wave-bar:nth-child(11) { animation-delay: 0.16s; }

    @keyframes audioDance {
      0% { height: 8px; }
      100% { height: 38px; }
    }

    /* Dynamic Subtitle Display Area */
    .subtitles-area {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      margin-top: 20px;
      text-align: center;
      padding: 0 16px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #c084fc;
      background: rgba(192, 132, 252, 0.12);
      border: 1px solid rgba(192, 132, 252, 0.25);
      padding: 5px 16px;
      border-radius: 999px;
      transition: all 0.3s ease;
    }

    .user-spoken-query {
      font-size: 16px;
      color: #94a3b8;
      font-style: italic;
      min-height: 24px;
      line-height: 1.4;
      max-width: 90%;
      word-break: break-word;
      transition: all 0.3s ease;
    }

    .ai-live-response {
      font-size: 21px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.5;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
      min-height: 56px;
      max-width: 95%;
      word-break: break-word;
      transition: all 0.3s ease;
    }

    /* Bottom Control Bar */
    .bottom-controls {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn-action-main {
      width: 100%;
      height: 58px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #d946ef 0%, #8b5cf6 50%, #06b6d4 100%);
      box-shadow: 0 8px 30px rgba(217, 70, 239, 0.45);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-action-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(217, 70, 239, 0.6);
    }

    .btn-action-main.active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.65);
      animation: btnPulse 1.8s infinite;
    }

    @keyframes btnPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .bottom-hint {
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.3px;
      text-align: center;
    }

    .bottom-hint strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <!-- Dynamic Ambient Lights -->
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Top HUD Bar -->
  <div class="top-hud">
    <div class="hud-brand">
      <span class="pulse-dot"></span>
      <span class="hud-title">SREE AI (श्री)</span>
    </div>
    <div class="hud-mode" id="modeBadge">🇮🇳 HINDI + ENGLISH (INDIAN VOICE)</div>
  </div>

  <!-- Interactive Center Stage: 3D Holographic AI Core -->
  <div class="stage-container" id="stageContainer" onclick="toggleContinuousVoiceSession()">
    <div class="orb-wrapper">
      <div class="energy-ring ring-1"></div>
      <div class="energy-ring ring-2"></div>
      <div class="energy-ring ring-3"></div>
      <div class="ai-orb" id="aiOrb">✨</div>
    </div>

    <!-- Live 11-Bar Audio Waveform -->
    <div class="waveform-box">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
  </div>

  <!-- Real-Time Dialogue Subtitle Stream -->
  <div class="subtitles-area">
    <div class="status-badge" id="statusBadge">
      <span id="statusIcon">●</span>
      <span id="statusLabel">टैप करें और बोलना शुरू करें (Tap to Speak)</span>
    </div>
    <div class="user-spoken-query" id="userQueryText"></div>
    <div class="ai-live-response" id="aiResponseText">Hello Buddy! Tap anywhere to talk in Hindi or English! 🌸</div>
  </div>

  <!-- Bottom Voice Action Bar -->
  <div class="bottom-controls">
    <button class="btn-action-main" id="mainActionButton" onclick="toggleContinuousVoiceSession()">
      <span id="actionIcon">🎙️</span>
      <span id="actionText">Start Voice Conversation</span>
    </button>
    <div class="bottom-hint">
      एक बार क्लिक करें—<strong>हिंदी या इंग्लिश में लगातार बात करते रहें!</strong>
    </div>
  </div>

  <script>
    const stageContainer = document.getElementById("stageContainer");
    const aiOrb = document.getElementById("aiOrb");
    const statusBadge = document.getElementById("statusBadge");
    const statusIcon = document.getElementById("statusIcon");
    const statusLabel = document.getElementById("statusLabel");
    const userQueryText = document.getElementById("userQueryText");
    const aiResponseText = document.getElementById("aiResponseText");
    const mainActionButton = document.getElementById("mainActionButton");
    const actionIcon = document.getElementById("actionIcon");
    const actionText = document.getElementById("actionText");

    // Continuous Dialogue Controller
    let isSessionActive = false;
    let isListening = false;
    let isSpeaking = false;
    let recognition = null;
    let conversationHistory = [];
    let cachedVoices = [];

    // Preload Speech Synthesis Voices
    function loadVoices() {
      if ('speechSynthesis' in window) {
        cachedVoices = window.speechSynthesis.getVoices();
      }
    }
    loadVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // High-tech Confirmation Chime
    function playChime(freq1 = 587.33, freq2 = 880) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq1, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq2, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.28);
      } catch (e) {
        console.log("AudioChime note:", e);
      }
    }

    // Detect if text is mostly Hindi
    function isHindi(text) {
      // Check Devanagari script range or common Hindi phonetic words
      const devanagari = /[\u0900-\u097F]/;
      return devanagari.test(text);
    }

    // Initialize Web Speech Recognition with Dual Support
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      // 'hi-IN' in Google Speech accurately transcribes both Hindi and English speech
      recognition.lang = 'hi-IN';

      recognition.onstart = () => {
        isListening = true;
        setVisualState("listening");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userQueryText.innerText = `🗣️ "${transcript}"`;
        handleVoiceQuery(transcript);
      };

      recognition.onerror = (event) => {
        console.log("Speech Recognition Event:", event.error);
        isListening = false;
        
        if (event.error === 'not-allowed') {
          isSessionActive = false;
          setVisualState("idle");
          aiResponseText.innerText = "Please allow microphone access in your browser!";
          return;
        }

        // For silence or timeouts: gracefully continue listening if session is active!
        if (isSessionActive && !isSpeaking) {
          setTimeout(resumeListeningSafe, 400);
        }
      };

      recognition.onend = () => {
        isListening = false;
        // Keep continuous loop active while session is active
        if (isSessionActive && !isSpeaking) {
          setTimeout(resumeListeningSafe, 300);
        }
      };
    }

    // Toggle Continuous Voice Session
    function toggleContinuousVoiceSession() {
      if (!recognition) {
        alert("Your browser does not support Speech Recognition. Please use Google Chrome.");
        return;
      }

      if (isSessionActive) {
        // Stop the session
        isSessionActive = false;
        if (recognition) try { recognition.stop(); } catch (e) {}
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        isListening = false;
        isSpeaking = false;
        setVisualState("idle");
        aiResponseText.innerText = "बातचीत रोक दी गई है। दोबारा शुरू करने के लिए टैप करें! 🌸";
        playChime(440, 220);
      } else {
        // Start continuous session (Only says 'Buddy' once at startup!)
        isSessionActive = true;
        playChime(587, 880);
        const greeting = "Hello Buddy! Sree is listening. You can speak in Hindi or English!";
        speak(greeting);
      }
    }

    function resumeListeningSafe() {
      if (!isSessionActive || isSpeaking || isListening) return;
      try {
        recognition.start();
      } catch (e) {
        // Ignored if already running
      }
    }

    // Visual State Controller
    function setVisualState(state) {
      stageContainer.className = "stage-container";

      if (state === "listening") {
        stageContainer.classList.add("listening");
        aiOrb.innerText = "👂";
        statusIcon.innerText = "●";
        statusLabel.innerText = "Listening... बोलिए (Speak in Hindi or English)";
        mainActionButton.classList.add("active");
        actionIcon.innerText = "⏹️";
        actionText.innerText = "Listening... (Tap to Pause)";
      } else if (state === "thinking") {
        stageContainer.classList.add("thinking");
        aiOrb.innerText = "🧠";
        statusIcon.innerText = "⚡";
        statusLabel.innerText = "Thinking... सोच रही हूँ";
      } else if (state === "speaking") {
        stageContainer.classList.add("speaking");
        aiOrb.innerText = "🗣️";
        statusIcon.innerText = "🔊";
        statusLabel.innerText = "Speaking... बोल रही हूँ";
      } else {
        aiOrb.innerText = "✨";
        statusIcon.innerText = "●";
        statusLabel.innerText = "टैप करें और बोलना शुरू करें (Tap to Speak)";
        mainActionButton.classList.remove("active");
        actionIcon.innerText = "🎙️";
        actionText.innerText = "Start Voice Conversation";
      }
    }

    // Authentic Indian Voice Selection
    function getIndianVoice(isTextHindi) {
      const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
      
      if (isTextHindi) {
        // Find best Hindi Indian Voice
        let v = voices.find(v => (v.lang === 'hi-IN' || v.lang.startsWith('hi')) && (v.name.includes("Google") || v.name.includes("Kalpana") || v.name.includes("Swara") || v.name.includes("Natural")));
        if (!v) v = voices.find(v => v.lang === 'hi-IN' || v.lang.startsWith('hi'));
        if (v) return v;
      }

      // Find best Indian English Voice (e.g. Google English India, Heera, Neerja, Veena)
      let indianVoice = voices.find(v => (v.lang === 'en-IN' || v.lang.includes('IN')) && (v.name.includes("Heera") || v.name.includes("Neerja") || v.name.includes("Veena") || v.name.includes("Google") || v.name.includes("India")));
      if (!indianVoice) indianVoice = voices.find(v => v.lang === 'en-IN' || v.lang.includes('IN'));
      if (!indianVoice) indianVoice = voices.find(v => v.name.toLowerCase().includes("india"));
      if (!indianVoice) indianVoice = voices.find(v => v.lang.startsWith("en") && (v.name.includes("Zira") || v.name.includes("Samantha")));

      return indianVoice;
    }

    // Voice Synthesis Engine with Authentic Indian Voice
    window.activeUtterance = null;

    function speak(text) {
      if (!('speechSynthesis' in window)) {
        alert("Your browser does not support speech synthesis.");
        return;
      }

      // Stop mic while speaking so AI doesn't hear itself!
      if (recognition && isListening) {
        try { recognition.stop(); } catch (e) {}
      }

      window.speechSynthesis.cancel();

      setTimeout(() => {
        try { window.speechSynthesis.resume(); } catch (e) {}

        const cleanText = text.replace(/[*_#`~\[\]]/g, '').trim();
        const textIsHindi = isHindi(cleanText);
        const selectedVoice = getIndianVoice(textIsHindi);

        const utterance = new SpeechSynthesisUtterance(cleanText);
        window.activeUtterance = utterance;

        if (selectedVoice) {
          utterance.voice = selectedVoice;
          utterance.lang = selectedVoice.lang || (textIsHindi ? 'hi-IN' : 'en-IN');
        } else {
          utterance.lang = textIsHindi ? 'hi-IN' : 'en-IN';
        }

        utterance.volume = 1.0;
        utterance.rate = 1.0;
        utterance.pitch = 1.05; // Pleasant, natural Indian tone

        utterance.onstart = () => {
          isSpeaking = true;
          setVisualState("speaking");
          aiResponseText.innerText = text;
        };

        // When Sree finishes speaking -> IMMEDIATELY LISTEN FOR NEXT QUESTION!
        utterance.onend = () => {
          isSpeaking = false;
          window.activeUtterance = null;
          if (isSessionActive) {
            setTimeout(resumeListeningSafe, 250);
          } else {
            setVisualState("idle");
          }
        };

        utterance.onerror = (e) => {
          console.log("Speech Error:", e);
          isSpeaking = false;
          window.activeUtterance = null;
          if (isSessionActive) {
            setTimeout(resumeListeningSafe, 250);
          } else {
            setVisualState("idle");
          }
        };

        window.speechSynthesis.speak(utterance);
      }, 50);
    }

    // Bilingual Voice Command & AI Intelligence Router
    async function handleVoiceQuery(query) {
      const q = query.toLowerCase().trim();
      const inHindi = isHindi(query) || q.includes("karo") || q.includes("batao") || q.includes("kya");

      // Stop / Exit
      if (q === "stop" || q === "bye" || q === "goodbye" || q === "exit" || q.includes("रुको") || q.includes("बाय") || q.includes("अलविदा") || q.includes("बस करो") || q.includes("बंद करो")) {
        isSessionActive = false;
        speak(inHindi ? "अलविदा! जब भी ज़रूरत हो, मुझे याद कीजिएगा।" : "Goodbye! Have a wonderful day ahead!");
        return;
      }

      // Play Music / Song on YouTube
      if (q.startsWith("play") || q.includes("गाना") || q.includes("song") || q.includes("music") || q.includes("बजाओ")) {
        const songName = query.replace(/(play|song|music|on youtube|गाना|बजाओ|चलाओ|प्ले)/gi, '').trim() || "trending songs";
        const reply = inHindi ? `YouTube पर ${songName} बजा रही हूँ!` : `Playing ${songName} on YouTube!`;
        speak(reply);
        window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(songName)}`, "_blank");
        return;
      }

      // WhatsApp
      if (q.includes("whatsapp") || q.includes("व्हाट्सएप")) {
        speak(inHindi ? "व्हाट्सएप वेब खोल रही हूँ।" : "Opening WhatsApp Web for you.");
        window.open("https://web.whatsapp.com", "_blank");
        return;
      }

      // YouTube
      if (q === "youtube" || q.includes("open youtube") || q.includes("यूट्यूब")) {
        speak(inHindi ? "यूट्यूब खोल रही हूँ।" : "Opening YouTube.");
        window.open("https://www.youtube.com", "_blank");
        return;
      }

      // Google Search
      if (q.startsWith("search") || q.includes("गूगल") || q.includes("सर्च") || q.includes("search google for")) {
        const term = query.replace(/(search for|search google for|search google|search|गूगल|सर्च|पर खोजो|ढूंढो)/gi, '').trim() || "Google";
        speak(inHindi ? `गूगल पर ${term} खोज रही हूँ।` : `Searching Google for ${term}.`);
        window.open(`https://www.google.com/search?q=${encodeURIComponent(term)}`, "_blank");
        return;
      }

      // Weather
      if (q.includes("weather") || q.includes("मौसम") || q.includes("तापमान") || q.includes("temperature")) {
        setVisualState("thinking");
        try {
          const cityMatch = query.match(/(?:in|for|of|में|का)\s+([a-zA-Z\u0900-\u097F\s]+)/i);
          const city = cityMatch ? cityMatch[1].trim() : "Delhi";
          const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
          const geoData = await geoRes.json();
          if (geoData.results && geoData.results.length > 0) {
            const { latitude, longitude, name, country } = geoData.results[0];
            const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
            const wData = await wRes.json();
            const temp = wData.current_weather.temperature;
            const wind = wData.current_weather.windspeed;
            const reply = inHindi ? `${name} में इस समय तापमान ${temp}°C है और हवा की गति ${wind} km/h है।` : `The current temperature in ${name}, ${country} is ${temp} degrees Celsius with wind speed of ${wind} kilometers per hour.`;
            speak(reply);
            return;
          }
        } catch (e) {
          console.log("Weather error:", e);
        }
        speak(inHindi ? "आज मौसम एकदम सुहाना और साफ है!" : "The weather is pleasant and clear today!");
        return;
      }

      // Jokes
      if (q.includes("joke") || q.includes("चुटकुला") || q.includes("मजाक") || q.includes("हंसाओ")) {
        const hindiJokes = [
          "टीचर ने पूछा: बताओ न्यूटन का चौथा नियम क्या है? संजू बोला: जब भूख लगे तो समोसा पेट की तरफ खिंचता है!",
          "पप्पू डॉक्टर से बोला: मुझे नींद में चलने की बीमारी है! डॉक्टर: रात को ताला लगा लिया करो! पप्पू: फिर बाहर घूमने कैसे जाऊँगा?"
        ];
        const engJokes = [
          "Why do programmers prefer dark mode? Because light attracts bugs!",
          "Why was the computer cold? It forgot to close its Windows!"
        ];
        const randomJoke = inHindi ? hindiJokes[Math.floor(Math.random() * hindiJokes.length)] : engJokes[Math.floor(Math.random() * engJokes.length)];
        speak(randomJoke);
        return;
      }

      // Current Time
      if (q.includes("time") || q.includes("समय") || q.includes("कितने बजे")) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
        speak(inHindi ? `घड़ी में अभी ठीक ${timeStr} बजे हैं।` : `It is currently ${timeStr}.`);
        return;
      }

      // Current Date
      if (q.includes("date") || q.includes("तारीख") || q.includes("दिन")) {
        const now = new Date();
        const dateStr = now.toLocaleDateString(inHindi ? 'hi-IN' : 'en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        speak(inHindi ? `आज ${dateStr} है।` : `Today is ${dateStr}.`);
        return;
      }

      // Creator
      if (q.includes("who made you") || q.includes("who created you") || q.includes("किसने बनाया") || q.includes("tumhe kisne banaya")) {
        speak(inHindi ? "मुझे Buddy ने बनाया है ताकि मैं आपकी स्मार्ट पर्सनल वॉइस असिस्टेंट बन सकूँ!" : "I was created by Buddy to be your smart personal voice assistant!");
        return;
      }

      // General Questions -> Gemini AI (Bilingual Indian Context)
      setVisualState("thinking");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: query,
            history: conversationHistory
          })
        });

        const data = await res.json();
        const reply = data.reply || data.error || (inHindi ? "माफ़ कीजिए, कोई तकनीकी समस्या आई।" : "Sorry, I encountered a temporary connection issue.");
        
        conversationHistory.push({ role: "user", text: query });
        conversationHistory.push({ role: "assistant", text: reply });
        if (conversationHistory.length > 8) conversationHistory = conversationHistory.slice(-8);

        speak(reply);
      } catch (err) {
        console.error(err);
        speak(inHindi ? "नेटवर्क में समस्या आई, कृपया अगला सवाल पूछिए।" : "I had trouble reaching the network. Please ask your next question!");
      }
    }
  </script>
